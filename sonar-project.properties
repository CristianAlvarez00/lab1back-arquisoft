# ──────────────────────────────────────────────────────────────
# SonarCloud project properties
# Reemplaza los valores de sonar.projectKey y sonar.organization
# con los que obtienes desde SonarCloud > Information del proyecto
# ──────────────────────────────────────────────────────────────

# Identificadores del proyecto (obtenlos en SonarCloud > Information)
sonar.projectKey=CristianAlvarez00_lab1back-arquisoft
sonar.organization=cristianalvarez00

# Metadatos del proyecto
sonar.projectName=lab1back-arquisoft
sonar.projectVersion=0.0.1-SNAPSHOT

# Rutas de código fuente y tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura: reporte XML generado por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Host
sonar.host.url=https://sonarcloud.io
