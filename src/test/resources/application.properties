# ──────────────────────────────────────────────────────────────
# Configuración de tests: usa H2 en memoria para no depender
# de MariaDB en CI/CD ni en entornos locales de test
# ──────────────────────────────────────────────────────────────

spring.application.name=lab1arq-test
server.port=0

# H2 en memoria (sustituye MariaDB durante los tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Habilitar consola H2 (opcional, útil en debug local)
spring.h2.console.enabled=false
